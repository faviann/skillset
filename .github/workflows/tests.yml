name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: scripts/select-skills.py.lock
      - name: Selector tests
        run: tests/run.sh selector

  stdlib:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Git and filesystem integration tests
        run: tests/run.sh stdlib
      - name: Install and check every profile, each in its own home
        shell: bash
        run: |
          set -euo pipefail
          profiles=()
          while IFS= read -r -d '' path; do
            case "$path" in profiles/*.txt) profiles+=("$(basename -- "$path" .txt)") ;; esac
          done < <(git ls-tree -z --name-only HEAD -- profiles/)
          (( ${#profiles[@]} )) || { echo "no profiles at HEAD" >&2; exit 1; }
          homes="$(mktemp -d)"
          trap 'rm -rf -- "$homes"' EXIT
          for profile in "${profiles[@]}"; do
            echo "::group::$profile"
            mkdir -- "$homes/$profile"
            export HOME="$homes/$profile"
            scripts/reconcile-skills.sh --profile "$profile"
            scripts/reconcile-skills.sh --check
            scripts/reconcile-skills.sh
            scripts/reconcile-skills.sh --check
            echo "::endgroup::"
          done
