name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Git and filesystem integration tests
        run: python3 scripts/test-reconcile-skills.py
      - name: Reconcile the committed real selection twice
        shell: bash
        run: |
          set -euo pipefail
          temporary_home="$(mktemp -d)"
          trap 'rm -rf -- "$temporary_home"' EXIT
          export HOME="$temporary_home"
          scripts/reconcile-skills.sh
          scripts/reconcile-skills.sh --check
          scripts/reconcile-skills.sh
          scripts/reconcile-skills.sh --check
